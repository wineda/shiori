<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>文 — 届いた文への返事（モック）</title>
<style>
@font-face{font-family:'Shippori Mincho';font-weight:400;font-display:swap;src:url('fonts/ShipporiMincho-400.woff2') format('woff2');}
@font-face{font-family:'Shippori Mincho';font-weight:500;font-display:swap;src:url('fonts/ShipporiMincho-500.woff2') format('woff2');}
@font-face{font-family:'Zen Kaku Gothic New';font-weight:400;font-display:swap;src:url('fonts/ZenKakuGothicNew-400.woff2') format('woff2');}
@font-face{font-family:'Zen Kaku Gothic New';font-weight:500;font-display:swap;src:url('fonts/ZenKakuGothicNew-500.woff2') format('woff2');}

:root{
  --paper:#F4F5F2; --surface:#FBFBF9; --card:#FFFFFF;
  --ink:#2B2E2B; --ink-soft:#5C615B; --muted:#9AA09A;
  --hairline:#E5E6E1; --hairline-strong:#D8D9D3;
  --accent:#9C4A50;
  --sans:'Zen Kaku Gothic New',system-ui,sans-serif;
  --mincho:'Shippori Mincho',serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:#e9eae6}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;gap:22px;padding:24px 12px 60px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
textarea{font-family:inherit}
.panel-label{font-size:11px;color:#8a8f89;letter-spacing:.12em;align-self:center;text-align:center;line-height:1.7}
.app{width:100%;max-width:400px;background:var(--paper);border-radius:22px;box-shadow:0 8px 40px rgba(0,0,0,.10);padding:18px 20px 22px}

/* ---- 水引カード（未開封） ---- */
.dg-letter{position:relative}
.dg-closed{position:relative;background:var(--surface);border:1px solid var(--hairline-strong);border-radius:16px;
  padding:20px 18px 18px;text-align:center;cursor:pointer;transition:transform .15s;overflow:hidden}
.dg-closed:active{transform:scale(.985)}
.dg-cap{font-size:12px;color:var(--ink-soft);letter-spacing:.05em}
.dg-sub{font-size:10px;color:var(--muted);margin-top:5px;letter-spacing:.04em}
.dg-mizuhiki{display:block;margin:2px auto 12px;width:78%;height:30px}
.dg-mizuhiki path{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round}
.dg-letter.opening .dg-mizuhiki{animation:dgUntie .55s ease forwards}
@keyframes dgUntie{50%{transform:scaleX(1.06);opacity:1}100%{transform:scaleX(1.15);opacity:0}}
.dg-letter.opening .dg-closed{animation:dgFade .4s ease .3s forwards}
@keyframes dgFade{to{opacity:0;transform:translateY(-6px)}}

/* ---- 便箋（開封後） ---- */
.dg-note{display:none;background:var(--card);border:1px solid var(--hairline-strong);border-radius:16px;padding:16px 18px 12px}
.dg-letter.open .dg-closed{display:none}
.dg-letter.open .dg-note{display:block;animation:noteIn .5s cubic-bezier(.22,.61,.36,1)}
@keyframes noteIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.dg-meta{font-size:10px;color:var(--accent);letter-spacing:.08em;margin-bottom:7px;display:flex;align-items:center;gap:6px}
.dg-meta::after{content:"";flex:1;height:1px;background:var(--hairline)}
.dg-text{font-size:14px;line-height:1.8;color:var(--ink)}

/* ---- 返事 ---- */
.henji{margin-top:12px;padding-left:14px}
.henji-meta{font-size:10px;color:var(--accent);letter-spacing:.06em;opacity:.85;margin-bottom:2px;display:flex;align-items:center;gap:6px}
.henji-meta .arrow{font-size:11px;opacity:.9}
.henji-text{font-size:13px;line-height:1.75;color:var(--ink-soft)}
/* 返事の入力 */
.henji-box{margin-top:12px;padding-left:14px}
.henji-cap{font-size:10px;color:var(--accent);letter-spacing:.06em;margin-bottom:6px}
.henji-input{width:100%;resize:none;border:1px solid var(--hairline-strong);background:var(--surface);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.7;min-height:52px;color:var(--ink);outline:none}
.henji-input::placeholder{color:var(--muted)}
.henji-input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(156,74,80,.15)}
.henji-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.henji-actions button{font-size:12px;border-radius:999px;padding:6px 16px;border:1px solid var(--hairline)}
.henji-cancel{color:var(--ink-soft);background:var(--surface)}
.henji-save{color:#fff;background:var(--accent);border-color:var(--accent)}

/* 便箋フッター */
.note-foot{display:flex;align-items:center;margin-top:10px}
.henji-btn{font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:5px 14px;letter-spacing:.05em}
.henji-edit{font-size:11px;color:var(--muted);padding:5px 10px}
.dg-fold{margin-left:auto;font-size:11px;color:var(--muted);padding:4px 8px}

/* 畳んだ一行 */
.mini{display:none;width:100%;text-align:left;font-size:11px;color:var(--muted);padding:9px 13px;background:var(--surface);border:1px solid var(--hairline);border-radius:12px;cursor:pointer;letter-spacing:.03em}
.mini .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:.5;margin-right:7px;vertical-align:1px}
.dg-letter.folded .dg-closed,.dg-letter.folded .dg-note{display:none}
.dg-letter.folded .mini{display:block;animation:noteIn .3s ease}

.hint{font-size:11px;color:#8a8f89;text-align:center;line-height:1.8;max-width:400px}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;font-size:13px;padding:11px 20px;border-radius:999px;opacity:0;transition:all .3s;letter-spacing:.04em;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="panel-label">届いた文に、返事を書く（水引をタップ → ひらく → 返事を書く）</div>

<div class="app">
  <div class="dg-letter" id="letter">
    <div class="dg-closed" id="dgClosed">
      <svg class="dg-mizuhiki" viewBox="0 0 300 30" aria-hidden="true">
        <path d="M0 15 H118 C132 15 130 5 143 5 C158 5 158 25 143 25 C130 25 132 15 146 15 C160 15 158 5 171 5 C186 5 186 25 171 25 C158 25 160 15 174 15 H300"/>
      </svg>
      <div class="dg-cap">きのうのわたしから、文が届いています</div>
      <div class="dg-sub">結びをほどいて、ひらく</div>
    </div>

    <div class="dg-note">
      <div class="dg-meta">きのうのわたしから</div>
      <div class="dg-text">今日は面接だね。緊張してると思うけど、昨日のうちに準備は全部やった。あとは、いつも通りに話すだけでいいよ。</div>

      <!-- 返事（保存後に表示） -->
      <div class="henji" id="henjiView" style="display:none">
        <div class="henji-meta"><span class="arrow">↩</span><span id="henjiMeta">きょうのわたしより、返事</span></div>
        <div class="henji-text" id="henjiText"></div>
      </div>

      <!-- 返事の入力 -->
      <div class="henji-box" id="henjiBox" style="display:none">
        <div class="henji-cap">きのうのわたしへ、返事</div>
        <textarea class="henji-input" id="henjiInput" placeholder="この文をくれたわたしに、いま伝えたいこと"></textarea>
        <div class="henji-actions">
          <button class="henji-cancel" id="henjiCancel" type="button">やめる</button>
          <button class="henji-save" id="henjiSave" type="button">返事をのこす</button>
        </div>
      </div>

      <div class="note-foot">
        <button class="henji-btn" id="henjiBtn" type="button">返事を書く</button>
        <button class="henji-edit" id="henjiEditBtn" type="button" style="display:none">なおす</button>
        <button class="dg-fold" id="dgFold" type="button">たたむ</button>
      </div>
    </div>

    <button class="mini" id="mini" type="button"><span class="dot"></span><span id="miniLabel">きのうのわたしから — タップで読み返す</span></button>
  </div>
</div>

<div class="hint">
  返事は届いた文の下に連なり、往復書簡になります。<br>
  履歴でその日（文を書いた日）をひらくと、文と返事がセットで読み返せます。<br>
  返事は1通・あとから「なおす」で書き直せます。
</div>

<script>
const letter=document.getElementById('letter');
let henji=null;   // {text, day}

document.getElementById('dgClosed').onclick=()=>{
  if(letter.classList.contains('opening')||letter.classList.contains('open')) return;
  letter.classList.add('opening');
  setTimeout(()=>{ letter.classList.remove('opening'); letter.classList.add('open'); },680);
};

const view=document.getElementById('henjiView');
const box=document.getElementById('henjiBox');
const btn=document.getElementById('henjiBtn');
const editBtn=document.getElementById('henjiEditBtn');
const input=document.getElementById('henjiInput');

function refresh(){
  view.style.display=henji?'block':'none';
  if(henji) document.getElementById('henjiText').textContent=henji.text;
  btn.style.display=henji?'none':'inline-block';
  editBtn.style.display=henji?'inline-block':'none';
  document.getElementById('miniLabel').textContent='きのうのわたしから'+(henji?'（返事あり）':'')+' — タップで読み返す';
}
function openBox(){
  box.style.display='block';
  btn.style.display='none'; editBtn.style.display='none';
  view.style.display='none';
  input.value=henji?henji.text:'';
  input.style.height='auto'; input.style.height=Math.max(52,input.scrollHeight)+'px';
  input.focus();
}
btn.onclick=openBox;
editBtn.onclick=openBox;
input.addEventListener('input',()=>{ input.style.height='auto'; input.style.height=input.scrollHeight+'px'; });
document.getElementById('henjiCancel').onclick=()=>{ box.style.display='none'; refresh(); };
document.getElementById('henjiSave').onclick=()=>{
  const v=input.value.trim();
  if(!v){ input.focus(); return; }
  henji={text:v};
  box.style.display='none';
  refresh();
  toast('きのうのわたしへ、返事をのこしました');
};
document.getElementById('dgFold').onclick=()=>{ letter.classList.remove('open'); letter.classList.add('folded'); };
document.getElementById('mini').onclick=()=>{ letter.classList.remove('folded'); letter.classList.add('open'); };

let toastT;
function toast(m){ const t=document.getElementById('toastEl'); t.textContent=m; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2000); }
</script>
<div class="toast" id="toastEl"></div>
</body>
</html>
