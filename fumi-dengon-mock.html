<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>文 — 伝言（あしたのわたしへ）モック</title>
<style>
@font-face{font-family:'Shippori Mincho';font-weight:400;font-display:swap;src:url('fonts/ShipporiMincho-400.woff2') format('woff2');}
@font-face{font-family:'Shippori Mincho';font-weight:500;font-display:swap;src:url('fonts/ShipporiMincho-500.woff2') format('woff2');}
@font-face{font-family:'Zen Kaku Gothic New';font-weight:400;font-display:swap;src:url('fonts/ZenKakuGothicNew-400.woff2') format('woff2');}
@font-face{font-family:'Zen Kaku Gothic New';font-weight:500;font-display:swap;src:url('fonts/ZenKakuGothicNew-500.woff2') format('woff2');}

:root{
  --paper:#F4F5F2; --surface:#FBFBF9; --card:#FFFFFF;
  --ink:#2B2E2B; --ink-soft:#5C615B; --muted:#9AA09A;
  --hairline:#E5E6E1; --hairline-strong:#D8D9D3;
  --accent:#9C4A50;
  --sans:'Zen Kaku Gothic New',system-ui,sans-serif;
  --mincho:'Shippori Mincho',serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:#e9eae6}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;gap:26px;padding:24px 12px 60px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
textarea{font-family:inherit}
.panel-label{font-size:11px;color:#8a8f89;letter-spacing:.12em;align-self:center}

.app{width:100%;max-width:400px;background:var(--paper);border-radius:26px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.10)}
.topbar{padding:18px 22px 12px;border-bottom:1px solid var(--hairline)}
.brand{font-family:var(--mincho);font-size:19px;font-weight:500;letter-spacing:.08em;position:relative;display:inline-block;padding-bottom:4px}
.brand::after{content:"";position:absolute;left:0;bottom:0;width:11px;height:2px;border-radius:2px;background:var(--accent)}
.brand::before{content:"";position:absolute;right:0;bottom:-1px;width:4px;height:4px;border-radius:50%;background:var(--accent)}
.screen-t{font-family:var(--mincho);font-size:20px;font-weight:500;letter-spacing:.08em;margin-top:6px}
.pad{padding:16px 20px 26px}
.daybar{text-align:center;padding:2px 0 14px;font-family:var(--mincho);font-size:15px;letter-spacing:.06em;color:var(--ink)}

/* ============ 封筒カード（きのうのわたしから） ============ */
.letter{position:relative;margin-bottom:16px}
/* --- 封筒（未開封） --- */
.envelope{
  position:relative;background:var(--surface);border:1px solid var(--hairline-strong);
  border-radius:16px;padding:22px 18px 18px;text-align:center;cursor:pointer;overflow:hidden;
  transition:transform .15s;
}
.envelope:active{transform:scale(.985)}
/* 封筒のフラップ（上辺から降りる三角） */
.envelope .flap{
  position:absolute;top:0;left:0;right:0;height:46px;pointer-events:none;
  background:linear-gradient(to bottom right, transparent 49.6%, var(--hairline) 49.6%, var(--hairline) 50.4%, transparent 50.4%) left/50% 100% no-repeat,
             linear-gradient(to bottom left,  transparent 49.6%, var(--hairline) 49.6%, var(--hairline) 50.4%, transparent 50.4%) right/50% 100% no-repeat;
}
.envelope .env-cap{font-size:12px;color:var(--ink-soft);letter-spacing:.05em;margin-top:40px}
.envelope .env-sub{font-size:10px;color:var(--muted);margin-top:5px;letter-spacing:.04em}
/* 封蝋 */
.seal{
  position:absolute;top:9px;left:50%;transform:translateX(-50%);
  width:26px;height:26px;border-radius:50%;background:var(--accent);
  box-shadow:0 1px 4px rgba(156,74,80,.4), inset 0 -2px 3px rgba(0,0,0,.15);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mincho);font-size:12px;color:#fff;font-weight:500;
  transition:transform .2s;
}
/* --- 開封アニメーション --- */
.letter.opening .seal{animation:crack .5s ease forwards}
@keyframes crack{
  0%{transform:translateX(-50%) scale(1) rotate(0deg)}
  35%{transform:translateX(-50%) scale(1.15) rotate(-8deg)}
  60%{transform:translateX(-50%) scale(.9) rotate(6deg);opacity:1}
  100%{transform:translateX(-50%) scale(.4) rotate(14deg);opacity:0}
}
.letter.opening .envelope{animation:envfade .45s ease .35s forwards}
@keyframes envfade{to{opacity:0;transform:translateY(-6px)}}
/* --- 便箋（開封後） --- */
.note{
  display:none;background:var(--card);border:1px solid var(--hairline-strong);border-radius:16px;
  padding:16px 18px 14px;position:relative;
}
.letter.open .envelope{display:none}
.letter.open .note{display:block;animation:noteIn .5s cubic-bezier(.22,.61,.36,1)}
@keyframes noteIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.note .n-meta{font-size:10px;color:var(--accent);letter-spacing:.08em;margin-bottom:7px;display:flex;align-items:center;gap:6px}
.note .n-meta::after{content:"";flex:1;height:1px;background:var(--hairline)}
.note .n-text{font-size:14px;line-height:1.8;color:var(--ink)}
.note .n-fold{display:block;margin:10px 0 0 auto;font-size:11px;color:var(--muted);padding:4px 8px}
/* --- 畳んだ状態（既読） --- */
.letter.folded .note{display:none}
.letter.folded .envelope{display:none}
.mini{display:none;font-size:11px;color:var(--muted);padding:8px 12px;background:var(--surface);border:1px solid var(--hairline);border-radius:12px;cursor:pointer;letter-spacing:.03em}
.mini .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:.5;margin-right:7px;vertical-align:1px}
.letter.folded .mini{display:block;animation:noteIn .3s ease}

/* ============ 呟き部分（簡略） ============ */
.compose{display:flex;gap:10px;align-items:flex-end;margin-bottom:6px}
.compose textarea{flex:1;resize:none;border:1px solid var(--hairline-strong);background:var(--card);border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.6;min-height:46px}
.compose textarea::placeholder{color:var(--muted)}
.post{background:var(--accent);color:#fff;font-size:14px;font-weight:500;padding:0 18px;height:46px;border-radius:14px;flex-shrink:0}

/* ============ 振り返り画面（書く側） ============ */
.g-box{background:var(--surface);border:1px solid var(--hairline);border-radius:16px;padding:14px 16px;margin-bottom:16px;font-size:13px;color:var(--ink-soft)}
.reflect-box textarea{width:100%;resize:none;border:1px solid var(--hairline-strong);background:var(--card);border-radius:14px;padding:14px;font-family:var(--mincho);font-size:15px;line-height:1.9;min-height:110px;color:var(--ink)}
.reflect-box textarea::placeholder{color:var(--muted);font-family:var(--mincho)}
/* あしたのわたしへ（伝言欄） */
.dengon{margin-top:16px}
.dengon .d-label{font-size:12px;color:var(--ink-soft);letter-spacing:.05em;margin-bottom:8px;display:flex;align-items:center;gap:7px}
.dengon .d-label .seal-mini{width:10px;height:10px;border-radius:50%;background:var(--accent);display:inline-block}
.dengon textarea{width:100%;resize:none;border:1px solid var(--hairline-strong);background:var(--card);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.7;min-height:52px}
.dengon textarea::placeholder{color:var(--muted)}
.dengon .d-hint{font-size:10px;color:var(--muted);margin-top:6px;line-height:1.6}
.save-btn{width:100%;margin-top:18px;background:var(--accent);color:#fff;font-family:var(--mincho);font-size:15px;letter-spacing:.14em;padding:15px;border-radius:14px}

.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;font-size:13px;padding:11px 20px;border-radius:999px;opacity:0;transition:all .3s;letter-spacing:.04em;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="panel-label">① 呟き画面 — きのうの伝言を受け取る（封蝋をタップ）</div>
<div class="app">
  <div class="topbar">
    <span class="brand">文</span>
    <div class="screen-t">呟き</div>
  </div>
  <div class="pad">
    <div class="daybar">‹　きょう　›</div>

    <!-- 封筒カード -->
    <div class="letter" id="letter">
      <div class="envelope" id="envelope" role="button" aria-label="伝言を開く">
        <div class="flap"></div>
        <div class="seal">文</div>
        <div class="env-cap">きのうのわたしから、文が届いています</div>
        <div class="env-sub">封蝋にふれて、ひらく</div>
      </div>
      <div class="note">
        <div class="n-meta">きのうのわたしから</div>
        <div class="n-text">8時に資源ごみを出すこと。それから、昨日は少し飲みすぎたから今日は休肝日に。夜には頼んでいた本が届くよ。</div>
        <button class="n-fold" id="foldBtn">たたむ</button>
      </div>
      <button class="mini" id="miniBtn"><span class="dot"></span>きのうのわたしから — タップで読み返す</button>
    </div>

    <div class="compose">
      <textarea rows="1" placeholder="いま、なにを思ってる?"></textarea>
      <button class="post">のこす</button>
    </div>
  </div>
</div>

<div class="panel-label">② 振り返り画面 — あしたのわたしへ伝言を書く</div>
<div class="app">
  <div class="topbar">
    <span class="brand">文</span>
    <div class="screen-t">振り返り</div>
  </div>
  <div class="pad">
    <div class="daybar">‹　きょう　›</div>
    <div class="g-box">きょう集めた呟き（2件）…</div>
    <div class="reflect-box">
      <textarea placeholder="ゆっくり、書きたいことを。"></textarea>
    </div>

    <!-- あしたのわたしへ（伝言欄） -->
    <div class="dengon">
      <div class="d-label"><span class="seal-mini"></span>あしたのわたしへ、ひとこと</div>
      <textarea id="dengonInput" rows="2" placeholder="あしたのわたしに、伝えておきたいこと"></textarea>
      <div class="d-hint">あしたの朝、呟き画面に封をして届きます。書かなくても文は出せます。</div>
    </div>

    <button class="save-btn" id="saveBtn">あしたへ文を出す</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const letter=document.getElementById('letter');
const envelope=document.getElementById('envelope');

// 開封：封蝋が割れる → 封筒が消える → 便箋がひらく
envelope.addEventListener('click',()=>{
  if(letter.classList.contains('opening')) return;
  letter.classList.add('opening');
  setTimeout(()=>{ letter.classList.remove('opening'); letter.classList.add('open'); }, 720);
});
// たたむ → 一行に。タップで読み返し
document.getElementById('foldBtn').onclick=()=>{ letter.classList.remove('open'); letter.classList.add('folded'); };
document.getElementById('miniBtn').onclick=()=>{ letter.classList.remove('folded'); letter.classList.add('open'); };

// 書く側
let toastT;
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2000); }
document.getElementById('saveBtn').onclick=()=>{
  const v=document.getElementById('dengonInput').value.trim();
  toast(v?'あしたへ文を出しました（伝言つき）':'あしたへ文を出しました');
};
const di=document.getElementById('dengonInput');
di.addEventListener('input',()=>{ di.style.height='auto'; di.style.height=di.scrollHeight+'px'; });
</script>
</body>
</html>
